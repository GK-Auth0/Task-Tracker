openapi: 3.0.3
info:
  title: Task Tracker API - Chat
  version: 1.0.0
  description: Chat groups, messages, and attachments
servers:
  - url: ${API_BASE_URL}
    description: Base URL (set API_BASE_URL env)
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        error: { type: string }
    ChatGroup:
      type: object
      additionalProperties: true
    ChatMessage:
      type: object
      additionalProperties: true
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        member_ids:
          type: array
          items: { type: string, format: uuid }
    SendMessageRequest:
      type: object
      properties:
        content: { type: string }
        attachment_url: { type: string, format: uri }
        attachment_name: { type: string }
paths:
  /api/chat/groups:
    get:
      tags: [Chat]
      summary: List chat groups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Groups retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatGroup' }
    post:
      tags: [Chat]
      summary: Create chat group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ChatGroup' }
  /api/chat/users/search:
    get:
      tags: [Chat]
      summary: Search users for chat
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { type: object }
  /api/chat/direct/{userId}:
    post:
      tags: [Chat]
      summary: Create or open direct chat
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Direct group
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ChatGroup' }
  /api/chat/groups/{groupId}/messages:
    get:
      tags: [Chat]
      summary: Get chat messages
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: before
          schema: { type: string }
      responses:
        '200':
          description: Messages retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
    post:
      tags: [Chat]
      summary: Send chat message
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ChatMessage' }
  /api/chat/groups/{groupId}/attachments:
    post:
      tags: [Chat]
      summary: Upload chat attachment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      attachment_url: { type: string, format: uri }
                      attachment_name: { type: string }
