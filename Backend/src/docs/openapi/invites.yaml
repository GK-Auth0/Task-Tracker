openapi: 3.0.3
info:
  title: Task Tracker API - Invites
  version: 1.0.0
  description: Workspace invitation workflows
servers:
  - url: ${API_BASE_URL}
    description: Base URL (set API_BASE_URL env)
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inviter_id:
          type: string
          format: uuid
        invitee_email:
          type: string
          format: email
        invitee_id:
          type: string
          format: uuid
          nullable: true
        invite_code:
          type: string
        status:
          type: string
          enum: [pending, accepted, expired]
        sent_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        invitee:
          type: object
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              enum: [Admin, Member, Viewer]
            avatar_url:
              type: string
              format: uri
    SendInviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Admin, Member, Viewer]
    AcceptInviteRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
        fullName:
          type: string
    ChangeInvitedPasswordRequest:
      type: object
      required: [email, newPassword]
      properties:
        email:
          type: string
          format: email
        newPassword:
          type: string
          minLength: 8
paths:
  /api/invites/send:
    post:
      tags: [Invites]
      summary: Send a new invite (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInviteRequest'
      responses:
        '201':
          description: Invite sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      inviteCode:
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        type: string
        '400':
          description: Send failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/invites/my-invites:
    get:
      tags: [Invites]
      summary: List invites sent by current admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invite list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/invites/{inviteCode}:
    get:
      tags: [Invites]
      summary: Get invite details by code
      parameters:
        - in: path
          name: inviteCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      inviteCode:
                        type: string
                      inviterName:
                        type: string
                      inviteeEmail:
                        type: string
                        format: email
                      status:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/invites/{inviteCode}/accept:
    post:
      tags: [Invites]
      summary: Accept invite and set password
      parameters:
        - in: path
          name: inviteCode
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                      fullName:
                        type: string
                      role:
                        type: string
        '400':
          description: Accept failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/invites/change-password:
    post:
      tags: [Invites]
      summary: Change password for invited user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInvitedPasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Change failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
