openapi: 3.0.3
info:
  title: Task Tracker API - Dashboard
  version: 1.0.0
  description: Dashboard summary, overview and insights
servers:
  - url: ${API_BASE_URL}
    description: Base URL (set API_BASE_URL env)
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        error: { type: string }
    DashboardSummary:
      type: object
      additionalProperties: true
    DashboardOverview:
      type: object
      additionalProperties: true
    DashboardInsights:
      type: object
      additionalProperties: true
paths:
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get summary cards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Get dashboard overview
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: upcomingLimit
          schema: { type: integer, default: 12 }
        - in: query
          name: activityLimit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Overview retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DashboardOverview' }
  /api/dashboard/insights:
    get:
      tags: [Dashboard]
      summary: Get insights
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Insights retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DashboardInsights' }
