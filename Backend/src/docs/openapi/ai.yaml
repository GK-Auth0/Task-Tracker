openapi: 3.0.3
info:
  title: Task Tracker API - AI Assistant
  version: 1.0.0
  description: AI assistant chat endpoint
servers:
  - url: ${API_BASE_URL}
    description: Base URL (set API_BASE_URL env)
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        error: { type: string }
    AiChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        routeContext: { type: string }
        responseMode:
          type: string
          enum: [concise, balanced, detailed]
    AiChatResponse:
      type: object
      properties:
        reply: { type: string }
        contextSnapshot: { type: string }
paths:
  /api/ai/chat:
    post:
      tags: [AI]
      summary: Chat with assistant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatRequest' }
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiChatResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
