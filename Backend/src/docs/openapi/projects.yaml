openapi: 3.0.3
info:
  title: Task Tracker API - Projects
  version: 1.0.0
  description: Project management API
servers:
  - url: ${API_BASE_URL}
    description: Base URL (set API_BASE_URL env)
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        error: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        memberIds:
          type: array
          items: { type: string, format: uuid }
    ProjectMemberUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [Admin, Member, Viewer] }
    ConfidentialAccessRequest:
      type: object
      properties:
        reason: { type: string }
    ReviewConfidentialAccessRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note: { type: string }
paths:
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Projects retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  pagination:
                    type: object
        '400':
          description: Failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Projects]
      summary: Create project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Project' }
        '400':
          description: Failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/projects/users:
    get:
      tags: [Projects]
      summary: Search users for member selection
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Users retrieved
  /api/projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Project retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Project' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Projects]
      summary: Update project
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '200':
          description: Project updated
        '404':
          description: Not found
        '403':
          description: Forbidden
    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Project deleted
  /api/projects/{id}/members:
    post:
      tags: [Projects]
      summary: Add project member
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string, enum: [Admin, Member, Viewer] }
      responses:
        '200':
          description: Member added
  /api/projects/{id}/members/{userId}:
    put:
      tags: [Projects]
      summary: Update project member role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberUpdate' }
      responses:
        '200':
          description: Member updated
    delete:
      tags: [Projects]
      summary: Remove project member
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member removed
  /api/projects/{id}/confidential-access/request:
    post:
      tags: [Projects]
      summary: Request confidential access
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfidentialAccessRequest' }
      responses:
        '200':
          description: Request submitted
  /api/projects/{id}/confidential-access/requests:
    get:
      tags: [Projects]
      summary: List confidential access requests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Requests retrieved
  /api/projects/{id}/confidential-access/requests/{requestId}:
    patch:
      tags: [Projects]
      summary: Review confidential access request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: requestId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewConfidentialAccessRequest' }
      responses:
        '200':
          description: Request reviewed
  /api/projects/{id}/activity:
    get:
      tags: [Projects]
      summary: Get project activity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Activity retrieved
  /api/projects/{id}/stats:
    get:
      tags: [Projects]
      summary: Get project stats
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stats retrieved
  /api/projects/{id}/roadmap:
    get:
      tags: [Projects]
      summary: Get project roadmap
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Roadmap retrieved
  /api/projects/{id}/files:
    get:
      tags: [Projects]
      summary: List project files
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Files retrieved
  /api/projects/{id}/files/upload:
    post:
      tags: [Projects]
      summary: Upload project file
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded
