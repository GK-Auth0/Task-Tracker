services:
  postgres:
    env_file: ./env/local/local.env
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    ports:
      - "5433:5433"
    environment:
      - PGPORT=5433
    networks:
      - db-net
    security_opt:
      - seccomp:unconfined
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

  migrator:
    env_file: ./env/local/local.env
    build:
      context: .
      dockerfile: ./env/Dockerfile
    networks:
      - db-net

networks:
  db-net:
    external: false
    name: db-net

volumes:
  postgres_data_local:
