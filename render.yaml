services:
  # Backend API Service
  - type: web
    name: task-tracker-api
    env: node
    buildCommand: cd Backend && yarn install && yarn build
    startCommand: cd Backend && yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_HOST
        fromDatabase:
          name: task-tracker-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: task-tracker-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: task-tracker-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: task-tracker-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: task-tracker-db
          property: password
      - key: DATABASE_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://task-tracker-frontend.onrender.com

  # AI Assistant Service
  - type: web
    name: task-tracker-ai
    env: python
    buildCommand: cd AI && pip install -r requirements.txt
    startCommand: cd AI && python assistant_server.py
    envVars:
      - key: AI_ENV
        value: production
      - key: AI_ALLOWED_ORIGINS
        value: https://task-tracker-frontend.onrender.com

  # Frontend Service
  - type: web
    name: task-tracker-frontend
    env: static
    buildCommand: cd UI && yarn install && yarn build
    staticPublishPath: ./UI/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://task-tracker-api.onrender.com
      - key: VITE_AI_ASSISTANT_URL
        value: https://task-tracker-ai.onrender.com

databases:
  - name: task-tracker-db
    databaseName: task_tracker_db
    user: postgres
